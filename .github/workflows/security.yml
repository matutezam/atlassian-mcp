name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]


jobs:
  trufflehog:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog secret scan
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/tmp" -w /tmp \
            ghcr.io/trufflesecurity/trufflehog:3.95.9 \
            filesystem . --results=verified,unknown --fail --no-update --github-actions
