# EasyPanel builds this service with Nixpacks.
# Keep uv pinned explicitly because EasyPanel/Nixpacks generated `pip install uv==`
# when NIXPACKS_UV_VERSION was not available during the Docker RUN layer.
[phases.install]
cmds = [
  "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install uv==0.10.2 && uv sync --no-dev --frozen"
]

[start]
cmd = "mcp-atlassian"
